<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#315b49"><title>Simple Expense Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f3;color:#26372e;font:16px system-ui,sans-serif}header{background:#315b49;color:white;padding:22px 18px;text-align:center}header h1{margin:0;font-size:25px}main{max-width:620px;margin:24px auto;padding:0 15px}.card{background:white;border:1px solid #e2e9e1;border-radius:16px;padding:19px;margin-bottom:16px}h2{font-size:18px;margin:0 0 14px}#total{font-size:34px;font-weight:800;color:#315b49}label{display:block;font-size:13px;font-weight:650;margin:12px 0 5px}input{width:100%;padding:12px;border:1px solid #d6dfd6;border-radius:10px;font:inherit}button,.upload{display:inline-block;border:0;border-radius:10px;padding:12px 16px;background:#315b49;color:white;font:600 15px system-ui;cursor:pointer;text-align:center}.upload.secondary,button.secondary{background:#e9f0e9;color:#315b49}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions>*{flex:1}.full{width:100%;margin-top:14px}.expense{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #edf0eb}.expense:last-child{border:0}.expense small{display:block;color:#77847a}.expense strong{white-space:nowrap}.delete{padding:6px 9px;background:#f8e9e7;color:#9c423a;font-size:12px}.empty{color:#7a867d;text-align:center;padding:15px}.note{font-size:12px;color:#78847b;line-height:1.5;margin:10px 0 0}#preview{max-width:100%;max-height:170px;display:none;margin-top:10px;border-radius:8px}#status{font-size:13px;color:#315b49;margin-top:8px;min-height:18px}@media(max-width:420px){main{margin:16px auto}.card{padding:15px}}
</style>
</head>
<body>
<header><h1>My Expenses</h1></header>
<main>
<section class="card">
  <h2>Total spent</h2>
  <div id="total">$0.00</div>
  <p class="note">Your expenses are saved on this device.</p>
</section>
<section class="card">
  <h2>Add an expense</h2>
  <div class="actions">
    <label class="upload" for="camera">📷 Take receipt photo</label>
    <label class="upload secondary" for="upload">Upload receipt</label>
  </div>
  <input id="camera" type="file" accept="image/*" capture="environment" hidden>
  <input id="upload" type="file" accept="image/*" hidden>
  <img id="preview" alt="Receipt preview">
  <div id="status"></div>
  <form id="form">
    <label for="description">What did you buy?</label>
    <input id="description" placeholder="Store or item" required>
    <label for="amount">Amount ($)</label>
    <input id="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required>
    <label for="date">Date</label>
    <input id="date" type="date" required>
    <button class="full" type="submit">Add expense</button>
  </form>
  <p class="note">Receipt scanning fills in details when it can. Please check the amount before adding.</p>
</section>
<section class="card">
  <h2>My expense list</h2>
  <div id="list" class="empty">No expenses yet.</div>
  <button id="export" class="secondary full" type="button">Download expense list (CSV)</button>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);
let expenses=[];try{expenses=JSON.parse(localStorage.getItem('pocketLedgerExpenses')||'[]')}catch(e){expenses=[]}
$('date').value=new Date().toISOString().slice(0,10);
function save(){localStorage.setItem('pocketLedgerExpenses',JSON.stringify(expenses));render()}
function render(){
 const total=expenses.reduce((sum,e)=>sum+Number(e.amount),0);$('total').textContent=money(total);
 $('list').className=expenses.length?'':'empty';
 $('list').innerHTML=expenses.length?expenses.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(e=>'<div class="expense"><div><b>'+safe(e.merchant)+'</b><small>'+safe(e.date)+'</small></div><strong>'+money(e.amount)+'</strong><button class="delete" data-id="'+safe(e.id)+'">Delete</button></div>').join(''):'No expenses yet.';
}
function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('form').addEventListener('submit',e=>{e.preventDefault();const amount=Number($('amount').value);if(amount<=0)return;expenses.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),merchant:$('description').value.trim(),amount,date:$('date').value});save();$('form').reset();$('date').value=new Date().toISOString().slice(0,10);$('status').textContent='Expense added!'});
$('list').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b&&confirm('Delete this expense?')){expenses=expenses.filter(x=>x.id!==b.dataset.id);save()}});
async function scan(file){if(!file)return;$('preview').src=URL.createObjectURL(file);$('preview').style.display='block';$('status').textContent='Reading receipt…';try{if(!window.Tesseract)throw Error('Receipt reader unavailable. Please enter details yourself.');const result=await Tesseract.recognize(file,'eng'),text=result.data.text,lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean);const found=[];for(const line of lines){if(/total|amount due|grand total|balance due/i.test(line)){const matches=line.match(/\$?\s*\d{1,5}[,.]\d{2}/g)||[];matches.forEach(v=>found.push(Number(v.replace('$','').replace(',',''))))}}if(found.length)$('amount').value=Math.max(...found).toFixed(2);const name=lines.find(x=>x.length>2&&!/receipt|thank you|www\.|http/i.test(x)&&!/\d{3,}/.test(x));if(name)$('description').value=name.slice(0,65);$('status').textContent=found.length?'Receipt scanned. Check the details below.':'Receipt scanned. Please enter the amount.'}catch(err){$('status').textContent=err.message||'Could not read receipt. Please enter details.'}}
$('camera').addEventListener('change',e=>scan(e.target.files[0]));$('upload').addEventListener('change',e=>scan(e.target.files[0]));
$('export').addEventListener('click',()=>{const rows=[['Date','Description','Amount'],...expenses.map(e=>[e.date,e.merchant,Number(e.amount).toFixed(2)])];const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));const a=document.createElement('a');a.href=url;a.download='my-expenses.csv';a.click();URL.revokeObjectURL(url)});
render();
</script>
</body>
</html>
